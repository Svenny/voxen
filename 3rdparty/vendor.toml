# Third-party sources vendored into this directory, one table per `3rdparty/<name>`.
# `tools/scripts/vendor.py` derives the directories from these entries
# (see its docstring for the keys), CI checks that the tree matches.
# `license_files` go into `THIRD_PARTY_NOTICES.md`, keep every license text and
# notice the compiled code is under (including bundled code with its own license).
#
# Bumping a version: edit `version` (and `sha256`, the script prints the new one),
# run `vendor.py update <name>`, fix whatever `keep`/`patches` stopped matching,
# review the diff and check that `3rdparty/<name>.cmake` still lists the right sources.

[catch2]
version = "3.16.1"
url = "https://github.com/catchorg/Catch2/archive/refs/tags/v{version}.tar.gz"
sha256 = "d16bd1b8b2364918bd472cb216394acb93bde6784890df0d91bccfb3f28d777d"
license = "BSL-1.0"
keep = ["src/catch2/**", "LICENSE.txt"]
exclude = ["src/catch2/meson.build"]
license_files = ["LICENSE.txt"]

[fmt]
version = "12.2.0"
url = "https://github.com/fmtlib/fmt/releases/download/{version}/fmt-{version}.zip"
sha256 = "a2f4a8d51178f954e4c339007f77edd76ba0cb2e36f87a48e5a5403d9be5878f"
license = "MIT"
keep = ["include/fmt/*.h", "src/format.cc", "LICENSE"]
license_files = ["LICENSE"]

[freetype]
version = "2.15.0"
url = "https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.xz"
sha256 = "93cd47eb719c325107f2d3cf087d06299e944c3b48a40b55537302304dea1dd5"
license = "FTL"
# Only the modules listed in `ftmodule.h` (see the patch) plus the base
keep = [
	"include/**",
	"src/autofit/*", "src/base/*", "src/cff/*", "src/psaux/*", "src/pshinter/*",
	"src/psnames/*", "src/sdf/*", "src/sfnt/*", "src/smooth/*", "src/truetype/*",
	"LICENSE.TXT", "docs/FTL.TXT",
]
exclude = ["src/*/*.mk", "src/autofit/*.cin", "src/autofit/*.hin", "src/autofit/*.dat", "src/base/ftver.rc"]
# Project build configuration: no compressed fonts, no SVG, trimmed module list
patches = ["config.patch"]
# Used under the FTL, which asks for this credit in the documentation (the year is the release's)
license_files = ["LICENSE.TXT", "docs/FTL.TXT"]
credit = "Portions of this software are copyright © 2026 The FreeType Project (https://freetype.org). All rights reserved."

[harfbuzz]
version = "14.6.0"
url = "https://github.com/harfbuzz/harfbuzz/releases/download/{version}/harfbuzz-{version}.tar.xz"
sha256 = "d07a007327277708a2a73ae437887cdbaf282937f6d03ca5467723e9099af586"
license = "MIT-old-style"
keep = ["src/*.cc", "src/*.hh", "src/*.h", "src/OT/**", "src/graph/**", "COPYING"]
exclude = ["src/harfbuzz-subset.cc", "src/harfbuzz-world.cc", "src/hb-subset*.cc", "src/main.cc", "src/test*.cc"]
license_files = ["COPYING"]

[llvm-demangle]
# The Itanium C++ ABI demangler from libc++abi, LLVM's own copy in `llvm/Demangle` is
# synced from it. Header-only core, the parser driver lives in `tk::demangle`.
version = "21.1.8"
url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-{version}/libcxxabi-{version}.src.tar.xz"
sha256 = "709c9a63bde1e36a80d8675becc38073b85f0fa1b4111e34542b885c9e1239da"
license = "Apache-2.0 WITH LLVM-exception"
keep = ["src/demangle/*.h", "src/demangle/*.def", "LICENSE.TXT"]
license_files = ["LICENSE.TXT"]

[sdl]
version = "3.4.18"
url = "https://github.com/libsdl-org/SDL/releases/download/release-{version}/SDL3-{version}.tar.gz"
sha256 = "9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3"
license = "Zlib"
# Common code of every subsystem and the Linux (X11, Wayland) and Windows backends,
# `sdl.cmake` picks what is built (see `sdl-config/SDL_build_config.h`).
keep = [
	"include/SDL3/*.h", "src/*.[ch]", "src/*/*.[ch]",
	"src/*/dlopen/*.[ch]", "src/*/dummy/*.[ch]", "src/*/generic/*.[ch]", "src/*/hidapi/*.[ch]",
	"src/*/linux/*.[ch]", "src/*/posix/*.[ch]", "src/*/pthread/*.[ch]", "src/*/unix/*.[ch]",
	"src/*/windows/*.[ch]", "src/video/windows/*.cpp",
	"src/joystick/hidapi/steam/*.h", "src/render/software/*.[ch]",
	"src/video/khronos/EGL/*.h", "src/video/khronos/KHR/*.h",
	"src/video/wayland/*.[ch]", "src/video/x11/*.[ch]", "src/video/yuv2rgb/*.[ch]",
	"wayland-protocols/*.xml", "LICENSE.txt",
	"src/hidapi/LICENSE.txt", "src/hidapi/LICENSE-bsd.txt", "src/video/yuv2rgb/LICENSE",
]
exclude = ["include/SDL3/SDL_opengl*.h", "include/SDL3/SDL_test*.h", "src/test/*"]
patches = ["vulkan-headers.patch", "ibus-no-glib.patch", "no-dynapi.patch"]
# Plus the bundled HIDAPI (used under its BSD-style option) and yuv2rgb, both compiled in
license_files = ["LICENSE.txt", "src/hidapi/LICENSE.txt", "src/hidapi/LICENSE-bsd.txt", "src/video/yuv2rgb/LICENSE"]

[vma]
version = "3.4.0"
url = "https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/archive/refs/tags/v{version}.tar.gz"
sha256 = "822aa850c6ce77346ae96a8a1d351d52e77e85929f35363849a0a4e638e0a2a1"
license = "MIT"
keep = ["include/vk_mem_alloc.h", "LICENSE.txt"]
license_files = ["LICENSE.txt"]

[vulkan-headers]
version = "1.4.363.0"
url = "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/vulkan-sdk-{version}.tar.gz"
sha256 = "4a078be12bef21cfebc09d878b77a63cff9d68f899254a0b00d0e37ef73e7f7e"
license = "Apache-2.0 OR MIT"
keep = [
	"include/vulkan/vk_platform.h", "include/vulkan/vulkan.h", "include/vulkan/vulkan_core.h",
	"include/vulkan/vulkan_wayland.h", "include/vulkan/vulkan_win32.h", "include/vulkan/vulkan_xcb.h",
	"include/vulkan/vulkan_xlib.h", "include/vulkan/vulkan_xlib_xrandr.h",
	"include/vk_video/*.h", "LICENSE.md", "LICENSES/MIT.txt",
]
# Used under the MIT option
license_files = ["LICENSE.md", "LICENSES/MIT.txt"]
# Tiny size/codegen optimization, trim exception handler sections around Vulkan API calls.
# Declares `VKAPI_NOEXCEPT`, the substitution below appends it to every function prototype.
patches = ["vkapi-noexcept-macro.patch"]

[[vulkan-headers.replace]]
files = ["include/vulkan/vulkan*.h"]
regex = '\);'
with = ') VKAPI_NOEXCEPT;'

[zlib]
version = "1.3.2"
url = "https://github.com/madler/zlib/releases/download/v{version}/zlib-{version}.tar.gz"
sha256 = "bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16"
license = "Zlib"
# Only deflate/inflate/crc32, no gzip file API
keep = ["*.c", "*.h", "LICENSE"]
exclude = ["compress.c", "uncompr.c", "gz*.c", "infback.c"]
license_files = ["LICENSE"]
