name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows only needs `glslc` from it; Linux takes it from distro packages
  # Keep in sync with the `vulkan-headers` version in `3rdparty/vendor.toml`
  VULKAN_SDK_VERSION: 1.4.363.0
  # Must match `LLVMToolsVersion` in `Directory.Build.props`
  LLVM_VERSION: 21.1.8
  CLANG_FORMAT_VERSION: 21

jobs:
  check-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }}
          clang-format-${{ env.CLANG_FORMAT_VERSION }} --version

      - name: Check formatting
        run: |
          git ls-files -z 'include/*.hpp' 'src/*.hpp' 'src/*.cpp' 'tests/*.hpp' 'tests/*.cpp' \
            | xargs -0 clang-format-${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror

  build-ubuntu:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ linux-debug, linux-release ]
        cmake-args: [ '' ]
        include:
          # EXPERIMENT: `import std;`
          - { preset: linux-debug, cmake-args: -DVOXEN_IMPORT_STD=ON }
    name: build-ubuntu (${{ matrix.preset }} ${{ matrix.cmake-args }})
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build mold glslc
          sudo apt-get install -y libwayland-dev libxkbcommon-dev xorg-dev
          clang --version
          cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}

  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - { configure-preset: windows-ninja, preset: windows-ninja-debug }
          - { configure-preset: windows-ninja, preset: windows-ninja-release }
          # EXPERIMENT: `import std;` with clang-cl and MS STL
          - { configure-preset: windows-ninja, preset: windows-ninja-debug, cmake-args: -DVOXEN_IMPORT_STD=ON, may-fail: true }
          # EXPERIMENT: modules are not supported by MSBuild with ClangCL toolset
          - { configure-preset: windows-vs2026, preset: windows-vs2026-relwithdebinfo, may-fail: true }
    name: build-windows (${{ matrix.preset }} ${{ matrix.cmake-args }})
    continue-on-error: ${{ matrix.may-fail == true }}
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Install LLVM
        run: |
          choco install llvm --version=${{ env.LLVM_VERSION }} --allow-downgrade --force -y
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - name: Cache Vulkan SDK installer
        id: cache-vulkan-sdk
        uses: actions/cache@v6
        with:
          path: VulkanSDK-Installer.exe
          key: windows-vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Download Vulkan SDK installer
        if: steps.cache-vulkan-sdk.outputs.cache-hit != 'true'
        run: |
          Invoke-WebRequest `
              https://sdk.lunarg.com/sdk/download/${{ env.VULKAN_SDK_VERSION }}/windows/vulkansdk-windows-X64-${{ env.VULKAN_SDK_VERSION }}.exe `
              -OutFile VulkanSDK-Installer.exe

      - name: Install Vulkan SDK
        run: ./VulkanSDK-Installer.exe --accept-licenses --default-answer --confirm-command install

      # Ninja needs `INCLUDE`/`LIB`/`PATH` for Windows SDK and MSVC CRT, MSBuild finds them on its own.
      # Does what `ilammy/msvc-dev-cmd` does, third-party actions are not allowed in this repo.
      - name: Enter MSVC developer environment
        if: matrix.configure-preset == 'windows-ninja'
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs/VC/Auxiliary/Build/vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }

      - name: Configure
        run: |
          cmake --version
          cmake --preset ${{ matrix.configure-preset }} -DCMAKE_PROGRAM_PATH=C:/VulkanSDK/${{ env.VULKAN_SDK_VERSION }}/Bin ${{ matrix.cmake-args }}

      # EXPERIMENT: look for C++ modules support in MSBuild ClangCL toolset files
      - name: Inspect MSBuild modules support
        if: matrix.configure-preset == 'windows-vs2026'
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath
          Get-ChildItem -Recurse "$vs/MSBuild/Microsoft/VC" -Include *.targets,*.props,*.xml |
            Select-String -Pattern 'ScanSourceForModuleDependencies|EnableModules|BuildStlModules' -List |
            ForEach-Object { $_.Path }
          $clang = Get-ChildItem -Recurse "$vs/MSBuild/Microsoft/VC" -Filter '*ClangCl*' | Select-Object -ExpandProperty FullName
          $clang
          $clang | ForEach-Object { Select-String -Path $_ -Pattern 'Module' } | Select-Object -First 40

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}
