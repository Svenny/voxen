name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match `LLVMToolsVersion` in `Directory.Build.props`
  LLVM_VERSION: 21.1.8
  CLANG_FORMAT_VERSION: 21

jobs:
  check-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }}
          clang-format-${{ env.CLANG_FORMAT_VERSION }} --version

      - name: Check formatting
        run: |
          git ls-files -z 'include/*.hpp' 'src/*.hpp' 'src/*.cpp' 'tests/*.hpp' 'tests/*.cpp' \
            'tools/*.hpp' 'tools/*.cpp' 'sandbox/*.hpp' 'sandbox/*.cpp' \
            | xargs -0 clang-format-${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror

  build-ubuntu:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ linux-debug, linux-release ]
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Fetch LFS objects
        # Source assets (fonts) and the host prebuilt shader compiler (`toolchains/`) are used by the build.
        # `lfs: true` of `actions/checkout` would ask GitHub LFS, not the `.lfsconfig` server.
        run: git lfs pull --exclude="toolchains/*/windows-*"

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build mold
          sudo apt-get install -y libwayland-dev libxkbcommon-dev xorg-dev
          clang --version
          cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}

  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        config: [ debug, release ]
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Fetch LFS objects
        # Source assets (fonts) and the host prebuilt shader compiler (`toolchains/`) are used by the build.
        # `lfs: true` of `actions/checkout` would ask GitHub LFS, not the `.lfsconfig` server.
        run: git lfs pull --exclude="toolchains/*/linux-*"

      - name: Install LLVM
        run: |
          choco install llvm --version=${{ env.LLVM_VERSION }} --allow-downgrade --force -y
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - name: Configure
        run: cmake --preset windows-vs2026

      - name: Build
        run: cmake --build --preset windows-vs2026-${{ matrix.config }}

      - name: Run tests
        run: ctest --preset windows-vs2026-${{ matrix.config }}
