name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 21.1.8
  CLANG_FORMAT_VERSION: 21

jobs:
  check-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }}
          clang-format-${{ env.CLANG_FORMAT_VERSION }} --version

      - name: Check formatting
        run: |
          git ls-files -z 'include/*.hpp' 'src/*.hpp' 'src/*.cpp' \
            'tests/*.hpp' 'tests/*.cpp' 'tools/*.hpp' 'tools/*.cpp' \
            | xargs -0 clang-format-${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror

  build-ubuntu:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ linux-debug, linux-release ]
        include:
          - preset: linux-debug
            configure-args: -DVOXEN_BUILD_SANDBOX=ON
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Fetch LFS objects
        # Built-in source assets are compiled by the build, the host's shader compiler is in `toolchains/`.
        # `lfs: true` of `actions/checkout` would ask GitHub LFS, not the `.lfsconfig` server.
        run: git lfs pull --exclude="toolchains/*/windows-*"

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build mold
          # Windowing system headers, the libraries are loaded at runtime
          sudo apt-get install -y libwayland-dev libxkbcommon-dev xorg-dev libdecor-0-dev libdbus-1-dev libudev-dev
          clang --version
          cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.configure-args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}

  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        preset: [ windows-ninja-debug, windows-ninja-release ]
        include:
          - preset: windows-ninja-debug
            configure-args: -DVOXEN_BUILD_SANDBOX=ON
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Fetch LFS objects
        # Built-in source assets are compiled by the build, the host's shader compiler is in `toolchains/`.
        # `lfs: true` of `actions/checkout` would ask GitHub LFS, not the `.lfsconfig` server.
        run: git lfs pull --exclude="toolchains/*/linux-*"

      - name: Install LLVM
        # A failed install leaves the runner's preinstalled LLVM in place, which would only show up as
        # a confusing configure error. Retry transient failures, then check the version we got.
        run: |
          # Check exit codes ourselves, don't throw on the first failure
          $PSNativeCommandUseErrorActionPreference = $false
          for ($attempt = 1; ; $attempt++) {
            choco install llvm --version=$env:LLVM_VERSION --allow-downgrade --force -y --no-progress
            if ($LASTEXITCODE -in 0, 1641, 3010) { break }
            if ($attempt -eq 3) { throw "choco failed to install LLVM $env:LLVM_VERSION (exit code $LASTEXITCODE)" }
            Write-Host "choco failed (exit code $LASTEXITCODE), retrying in 30 seconds"
            Start-Sleep -Seconds 30
          }
          $version = & "C:\Program Files\LLVM\bin\clang-cl.exe" --version
          $version
          if (-not ($version -match "clang version $([regex]::Escape($env:LLVM_VERSION))\b")) {
            throw "Expected LLVM $env:LLVM_VERSION after installing it"
          }

      - name: Configure
        run: |
          cmake --version
          cmake --preset windows-ninja ${{ matrix.configure-args }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}
