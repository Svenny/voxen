name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match `LLVMToolsVersion` in `Directory.Build.props`
  LLVM_VERSION: 21.1.8
  CLANG_FORMAT_VERSION: 21

jobs:
  check-format:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-${{ env.CLANG_FORMAT_VERSION }}
          clang-format-${{ env.CLANG_FORMAT_VERSION }} --version

      - name: Check formatting
        run: |
          git ls-files -z 'include/*.hpp' 'src/*.hpp' 'src/*.cpp' \
            'tests/*.hpp' 'tests/*.cpp' 'tools/*.hpp' 'tools/*.cpp' \
            | xargs -0 clang-format-${{ env.CLANG_FORMAT_VERSION }} --dry-run --Werror

  build-ubuntu:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ linux-debug, linux-release ]
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Fetch LFS objects
        # Built-in source assets are compiled by the build, the host's shader compiler is in `toolchains/`.
        # `lfs: true` of `actions/checkout` would ask GitHub LFS, not the `.lfsconfig` server.
        run: git lfs pull --exclude="toolchains/*/windows-*"

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build mold
          # Windowing system headers, the libraries are loaded at runtime
          sudo apt-get install -y libwayland-dev libxkbcommon-dev xorg-dev libdecor-0-dev libdbus-1-dev libudev-dev
          clang --version
          cmake --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}

  build-windows:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - { configure-preset: windows-ninja, preset: windows-ninja-debug }
          - { configure-preset: windows-ninja, preset: windows-ninja-release }
          - { configure-preset: windows-vs2026, preset: windows-vs2026-release }
    name: build-windows (${{ matrix.preset }})
    steps:
      - name: Checkout the commit
        uses: actions/checkout@v7

      - name: Fetch LFS objects
        # Built-in source assets are compiled by the build, the host's shader compiler is in `toolchains/`.
        # `lfs: true` of `actions/checkout` would ask GitHub LFS, not the `.lfsconfig` server.
        run: git lfs pull --exclude="toolchains/*/linux-*"

      - name: Install LLVM
        run: |
          choco install llvm --version=${{ env.LLVM_VERSION }} --allow-downgrade --force -y
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      # Ninja needs `INCLUDE`/`LIB`/`PATH` for Windows SDK and MSVC CRT, MSBuild finds them on its own
      - name: Enter MSVC developer environment
        if: matrix.configure-preset == 'windows-ninja'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: |
          cmake --version
          cmake --preset ${{ matrix.configure-preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests
        run: ctest --preset ${{ matrix.preset }}
